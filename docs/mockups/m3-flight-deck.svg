<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">NGEN M3 flight deck visual direction</title>
<desc id="desc">Design mockup, not a running client. Original NGEN branding, separate speed and actuation instruments, contextual target actions and an unobstructed scene. Values are illustrative.</desc>
<defs>
  <radialGradient id="space"><stop stop-color="#18313c"/><stop offset="1" stop-color="#071319"/></radialGradient>
  <style>
    text { font-family:system-ui,'Segoe UI',sans-serif; fill:#DDF3F8; }
    .label { font-size:10px; letter-spacing:1.6px; fill:#A9C5D0; }
    .mono { font-family:ui-monospace,Consolas,'Liberation Mono',monospace; }
    .muted { fill:#A9C5D0; }
    .cyan { fill:#63DDF8; }
    .violet { fill:#B6A5FF; }
    .button { fill:#14313D; stroke:#7899A6; stroke-width:1; }
    .button-label { font-size:12px; }
  </style>
</defs>
<rect width="1280" height="720" fill="url(#space)"/>
<g fill="#A9C5D0" opacity=".45">
  <circle cx="76" cy="196" r=".8"/><circle cx="218" cy="264" r=".6"/>
  <circle cx="317" cy="142" r=".8"/><circle cx="470" cy="279" r=".6"/>
  <circle cx="698" cy="174" r=".7"/><circle cx="812" cy="285" r=".7"/>
  <circle cx="946" cy="380" r=".6"/><circle cx="1101" cy="450" r=".8"/>
  <circle cx="227" cy="547" r=".6"/><circle cx="715" cy="473" r=".8"/>
</g>
<!-- Supplied SVG master artwork, unchanged paths/colours, proportional with clear space. -->
<path d="M24 16H244L252 24V70H24L16 62V24Z" fill="#0E222C"/>
<svg x="22" y="20" width="176" height="48.609524" viewBox="-14 -14 315 87"><g transform="translate(0 -23.5)"><g transform="translate(0 23.5)"><path d="M0 59V5L5 0H13L35 21L31 25L34 28L27 37L14 25V59ZM40 25L54 38V0H68V59H55L31 41L39 33L35.5 29.5Z" fill="#63DDF8"/><path d="M40 25L54 38V58.25L31 41L39 33L35.5 29.5ZM20 38L42 58H35L20 45Z" fill="#B6A5FF"/><g transform="rotate(180 34 29.5)"><path d="M20 38L42 58H35L20 45Z" fill="#B6A5FF"/></g><g transform="translate(78 0)"><path d="M10 0H65V12H17L13 16V43L17 47H49L53 43V35H36V24H66V49L56 59H10L0 49V10Z" fill="#DDF3F8"/></g><g transform="translate(154 0)"><path d="M0 0H59V12H13V23H50V35H13V47H59V59H0Z" fill="#DDF3F8"/></g><g transform="translate(223 0)"><path d="M0 0H13L50 37V0H64V59H50L13 22V59H0Z" fill="#DDF3F8"/></g></g></g></svg>
<text x="218" y="38" class="label" transform="rotate(90 218 38)">FLIGHT</text>
<path d="M278 28H280V57H278" stroke="#B6A5FF" stroke-width="2"/>
<text x="294" y="38" class="label">LOCAL AUTHORITY</text>
<text x="294" y="57" font-size="13">TACTICAL <tspan class="muted">/ ORBIT VIEW</tspan></text>
<g>
  <path class="button" d="M1060 23H1162L1168 29V53H1060Z"/>
  <text x="1072" y="43" class="button-label">Audio on</text><text x="1146" y="43" class="mono muted" font-size="11">M</text>
  <path class="button" d="M1180 23H1256V47L1250 53H1180Z"/>
  <text x="1192" y="43" class="button-label">Help</text><text x="1232" y="43" class="mono muted" font-size="11">F1</text>
</g>
<!-- Representative selection brackets; no private ship/capture is embedded. -->
<g stroke="#63DDF8" stroke-width="1.5" fill="none" opacity=".8">
  <path d="M802 302H792V312M836 302H846V312M792 336V346H802M836 346H846V336"/>
  <path d="M634 360H640M648 360H654M644 350V356M644 364V370" opacity=".55"/>
</g>
<text x="819" y="366" text-anchor="middle" class="mono muted" font-size="10">ASTEROID 000</text>
<text x="640" y="440" text-anchor="middle" class="label" opacity=".35">LIVE FLIGHT VIEW — UNCHANGED</text>
<!-- Compact selected-object context, not a new overview or map system. -->
<path d="M1012 100H1252L1260 108V292H1012L1004 284V108Z" fill="#0E222C" fill-opacity=".96"/>
<path d="M1012 100H1084M1259 112V146M1004 250V284L1012 292H1082" fill="none" stroke="#315362"/>
<text x="1020" y="123" class="label">SELECTED CONTACT</text>
<text x="1020" y="149" font-size="18">Asteroid <tspan class="mono">000</tspan></text>
<text x="1020" y="173" class="mono muted" font-size="13">618 m <tspan class="label">/ RANGE</tspan></text>
<path d="M1020 189H1244V216H1020Z" class="button"/>
<text x="1031" y="207" class="button-label">Approach</text><text x="1225" y="207" class="mono muted" font-size="11">G</text>
<path d="M1020 225H1244V252H1020Z" fill="#14313D" stroke="#63DDF8"/>
<path d="M1020 225V252" stroke="#63DDF8" stroke-width="3"/>
<text x="1031" y="243" class="button-label cyan">Orbit active</text><text x="1225" y="243" class="mono cyan" font-size="11">O</text>
<text x="1031" y="276" class="button-label">Focus / ship</text><text x="1225" y="276" class="mono muted" font-size="11">F</text>
<!-- An original stepped NGEN instrument deck; no EVE medallion or module art. -->
<path d="M384 548H892L904 560V664L892 676H384L372 664V560Z" fill="#0E222C" fill-opacity=".97"/>
<path d="M384 548H484M806 548H892L904 560V595M904 638V664L892 676H794M482 676H384L372 664V620M372 582V560L384 548" fill="none" stroke="#315362"/>
<path d="M391 548H424M391 552H414" fill="none" stroke="#B6A5FF" stroke-width="1.4"/>
<!-- Actual speed is its own read-only scale, not a velocity setter. -->
<text x="398" y="570" class="label">ACTUAL SPEED</text>
<path d="M415 646A42 42 0 1 1 479 646" fill="none" stroke="#315362" stroke-width="5"/>
<path d="M415 646A42 42 0 0 1 407 608" fill="none" stroke="#63DDF8" stroke-width="5"/>
<g stroke="#7899A6" stroke-width="1"><path d="M411 651L414 647M400 620H406M413 586L416 591M447 578V584M481 586L478 591M494 620H488M483 651L480 647"/></g>
<text x="447" y="625" text-anchor="middle" class="mono" font-size="27">20.0</text>
<text x="447" y="642" text-anchor="middle" class="mono muted" font-size="10">m/s</text>
<text x="403" y="664" class="mono muted" font-size="9">0</text><text x="481" y="664" class="mono muted" font-size="9">100</text>
<path d="M519 570V654" stroke="#315362"/>
<!-- Guidance and actual actuator firing remain deliberately distinct. -->
<text x="539" y="572" class="label">GUIDANCE</text>
<text x="539" y="591" class="cyan" font-size="14">ORBIT ACTIVE</text>
<text x="539" y="615" class="label">ACTUATION</text>
<text x="539" y="635" class="mono" font-size="12">MAIN 0%</text>
<text x="539" y="654" class="mono muted" font-size="12">RCS 0/16</text>
<g fill="#14313D" stroke="#315362">
  <path d="M645 626H657V638H645ZM661 626H673V638H661ZM677 626H689V638H677ZM693 626H705V638H693ZM709 626H721V638H709ZM725 626H737V638H725ZM741 626H753V638H741ZM757 626H769V638H757Z"/>
  <path d="M645 642H657V654H645ZM661 642H673V654H661ZM677 642H689V654H677ZM693 642H705V654H693ZM709 642H721V654H709ZM725 642H737V654H725ZM741 642H753V654H741ZM757 642H769V654H757Z"/>
</g>
<text x="645" y="615" class="label">FIRING BANKS</text>
<g>
  <path d="M789 566H887V591H789Z" class="button"/>
  <text x="799" y="583" class="button-label">View</text><text x="857" y="583" class="mono muted" font-size="10">TAB</text>
  <path d="M789 602H887V627H789Z" class="button"/>
  <text x="799" y="619" class="button-label">Flight data</text>
  <text x="799" y="653" class="button-label muted">Reset</text><text x="874" y="653" class="mono muted" font-size="10">R</text>
</g>
<text x="640" y="703" text-anchor="middle" class="mono muted" font-size="11">RMB orbit / steer · SPACE brake · TAB view · F1 help · F12 performance</text>
<text x="16" y="707" class="label" font-size="8">DESIGN MOCKUP</text>
</svg>
