  <path d="M280 662v30M406 662v30M532 662v30M681 662v30M925 662v30" class="divider"/>
  <text x="297" y="672" class="small muted">CPU FRAME</text><text x="297" y="691" class="mono">— ms</text>
  <text x="423" y="672" class="small muted">GPU PASSES</text><text x="423" y="691" class="mono">— ms</text>
  <text x="549" y="672" class="small muted">VMA / DRIVER</text><text x="549" y="691" class="mono">— / — MiB</text>
