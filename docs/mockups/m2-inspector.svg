  <text x="973" y="208" class="small muted">PBR / METALLIC–ROUGHNESS</text>
  <text x="973" y="239" class="muted">Base color</text>
  <rect x="1114" y="224" width="132" height="22" rx="1" fill="#77858f" stroke="#a9b7c2"/>
  <text x="973" y="273" class="muted">Metallic</text><text x="1246" y="273" text-anchor="end" class="mono">0.850</text>
  <path d="M974 289h270" stroke="#30404c" stroke-width="5"/><path d="M974 289h230" stroke="#81afb9" stroke-width="5"/>
  <text x="973" y="319" class="muted">Roughness</text><text x="1246" y="319" text-anchor="end" class="mono">0.420</text>
  <path d="M974 335h270" stroke="#30404c" stroke-width="5"/><path d="M974 335h113" stroke="#81afb9" stroke-width="5"/>
  <text x="973" y="367" class="muted">Emissive strength</text><text x="1246" y="367" text-anchor="end" class="mono">1.000</text>
  <text x="973" y="397" class="muted">Alpha / facing</text><text x="1246" y="397" text-anchor="end" class="mono">OPAQUE / BOTH</text>
  <path d="M973 415h273" class="divider"/>
