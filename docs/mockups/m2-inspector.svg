  <text x="98" y="229" class="muted">Transforms &amp; bounds</text>
  <path d="M78 247h218" class="divider"/>
  <text x="78" y="270" class="mono muted">▸</text><text x="97" y="270">Asteroid shell</text>
  <text x="97" y="291" class="small muted">100 INSTANCES / SHARED MESH</text>
  <rect x="956" y="86" width="308" height="548" rx="2" class="panel"/>
  <text x="972" y="109" class="heading">INSPECTOR</text><text x="1194" y="109" class="small muted">PREVIEW</text>
  <path d="M957 122h306" class="divider"/>
  <text x="973" y="145" class="small cyan">MATERIAL</text><text x="1078" y="145" class="small muted">RENDER</text><text x="1167" y="145" class="small muted">ASSET</text>
  <path d="M970 154h80" stroke="#81c1c9" stroke-width="2"/>
