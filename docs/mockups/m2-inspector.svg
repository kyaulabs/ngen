  <path d="M0 51.5h1280" class="divider"/>
  <text x="19" y="32" font-size="16" letter-spacing="3">NGEN</text>
  <path d="M104 15v23" class="divider"/>
  <text x="122" y="26" class="heading">SCENE INSPECTOR</text>
  <text x="122" y="41" class="small muted">DEVELOPMENT / LAPTOP PROFILE</text>
  <text x="676" y="31" class="mono muted">1280 × 720</text>
  <text x="826" y="31" class="mono muted">LOD 2</text>
  <rect x="1048" y="15" width="212" height="24" rx="2" fill="#29251f" stroke="#67543c"/>
  <text x="1060" y="31" class="small amber">STATIC MOCKUP · NOT LIVE</text>
  <rect y="52" width="42" height="668" fill="#10171f"/>
  <path d="M41.5 52v668" class="divider"/>
  <rect x="6" y="86" width="30" height="34" rx="2" fill="#253842" stroke="#79b4c0"/>
  <path d="M13 96h16v13H13ZM17 92v4M25 109v4" fill="none" stroke="#afd8df"/>
  <text x="10" y="151" class="small muted">MAT</text>
  <text x="10" y="194" class="small muted">GPU</text>
  <text x="10" y="237" class="small muted">LOG</text>
  <rect x="62" y="86" width="250" height="234" rx="2" class="panel"/>
  <text x="78" y="109" class="heading">SCENE</text><text x="261" y="109" class="mono muted">02</text>
  <path d="M63 122h248" class="divider"/>
  <text x="78" y="145" class="mono muted">▾</text><text x="97" y="145">frigate-01</text>
  <text x="97" y="164" class="small muted">188 PRIMITIVES / 13 MATERIALS</text>
  <rect x="73" y="178" width="227" height="29" rx="1" fill="#213540"/>
  <rect x="73" y="178" width="2" height="29" fill="#81c1c9"/>
