<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">NGEN development inspector — static visual mockup</title>
  <desc id="description">Original EVE-inspired art direction: compact dark panels, tabular diagnostics and restrained cyan/amber highlights. The spacecraft is an original schematic, not the supplied frigate. Controls and telemetry are not connected to the engine.</desc>
  <defs>
    <radialGradient id="space"><stop stop-color="#182632"/><stop offset="1" stop-color="#070b10"/></radialGradient>
    <linearGradient id="hull" x2="0" y2="1"><stop stop-color="#52616d"/><stop offset=".45" stop-color="#263844"/><stop offset="1" stop-color="#111b24"/></linearGradient>
    <linearGradient id="engine"><stop stop-color="#70bfcf" stop-opacity=".7"/><stop offset="1" stop-color="#70bfcf" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#71889a" stroke-opacity=".025"/></pattern>
    <g id="rock"><path d="M-5-3 0-7 6-3 7 3 1 7-6 3Z" fill="#56606b" stroke="#788490" stroke-width=".5"/><path d="m-5-3 6 2 5-2M1-1 1 7" fill="none" stroke="#2a343e"/></g>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; fill: #cbd6de; font-size: 12px; }
      .muted { fill: #96a6b3; }
      .small { font-size: 10px; letter-spacing: 1px; }
      .mono { font-family: 'DejaVu Sans Mono', monospace; font-variant-numeric: tabular-nums; }
      .heading { font-size: 11px; letter-spacing: 1.3px; fill: #dae4eb; }
      .cyan { fill: #8ad1d6; }
      .amber { fill: #e0b67d; }
      .panel { fill: #111923; fill-opacity: .97; stroke: #34434f; stroke-width: 1; }
      .divider { stroke: #2a3642; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#space)"/>
  <rect x="42" y="52" width="1238" height="616" fill="url(#grid)"/>
  <g fill="#bac9d6" opacity=".45">
    <circle cx="364" cy="121" r="1"/><circle cx="870" cy="97" r=".8"/><circle cx="691" cy="162" r="1"/>
    <circle cx="544" cy="92" r=".7"/><circle cx="402" cy="576" r=".8"/><circle cx="818" cy="597" r="1"/>
    <circle cx="590" cy="528" r=".8"/><circle cx="886" cy="229" r="1"/><circle cx="725" cy="648" r=".8"/>
    <circle cx="302" cy="462" r=".7"/><circle cx="927" cy="519" r=".9"/><circle cx="761" cy="278" r=".7"/>
  </g>
  <g opacity=".75">
    <use href="#rock" x="352" y="369" transform="rotate(17 352 369)"/>
    <use href="#rock" x="386" y="243" transform="scale(.7) translate(165 104)"/>
    <use href="#rock" x="457" y="206"/><use href="#rock" x="544" y="185"/>
    <use href="#rock" x="657" y="205"/><use href="#rock" x="752" y="229"/>
    <use href="#rock" x="866" y="275"/><use href="#rock" x="922" y="344"/>
    <use href="#rock" x="899" y="421"/><use href="#rock" x="837" y="493"/>
    <use href="#rock" x="746" y="531"/><use href="#rock" x="639" y="554"/>
    <use href="#rock" x="532" y="538"/><use href="#rock" x="437" y="489"/>
    <use href="#rock" x="374" y="441"/><use href="#rock" x="714" y="178"/>
    <use href="#rock" x="568" y="608"/><use href="#rock" x="797" y="575"/>
  </g>
  <g stroke="#7a929f" stroke-width="1">
    <path d="m360 371 72-14 74-2 42-14 108 2 31 17 146 2 23 12-23 14-147 2-28 14-107-2-41-12-79-3Z" fill="url(#hull)"/>
    <path d="m525 353 35-30 83 4 21 21-8 9M528 387l30 28 87-4 19-19" fill="#283b48"/>
    <path d="m671 360 25-20 70 2 16 19M672 389l24 21 72-3 12-18" fill="#24343e"/>
    <path d="M412 369h406M503 356v32M550 342v60M658 347v49M704 360v29M759 360v28" stroke="#71818a" stroke-opacity=".65"/>
    <rect x="804" y="363" width="28" height="8" fill="#172831"/><rect x="804" y="379" width="28" height="8" fill="#172831"/>
    <path d="m833 363 66-6v17l-66-3M833 379l75-2v18l-75-8" fill="url(#engine)" stroke="none"/>
    <path d="M804 365h28M804 383h28" stroke="#a9e9eb" stroke-width="2"/>
    <path d="M563 337h28M563 407h28" stroke="#83b9c7" stroke-width="2"/>
  </g>
  <g stroke="#87bdc8" stroke-width="1" fill="none" opacity=".8">
    <path d="M344 340v-12h22M830 328h22v12M344 402v14h22M830 416h22v-14"/>
    <path d="m633 405 21 33h91"/>
  </g>
