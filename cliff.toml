# NGEN Conventional Commit changelog; nested below the release logo/overview.
[changelog]
header = "## 📜 Changelog\n\n"
body = """
### {% if version %}[{{ version | trim_start_matches(pat="v") }}](https://github.com/kyaulabs/ngen/releases/tag/{{ version }}){% else %}Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
#### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/kyaulabs/ngen/commit/{{ commit.id }})){% if commit.breaking %} — **BREAKING:** {{ commit.breaking_description }}{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""
postprocessors = [{ pattern = "\\n+$", replace = "" }]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/kyaulabs/ngen/issues/$1" },
]
commit_parsers = [
  { message = "^feat|^patch", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Fixes" },
  { message = "^docs", group = "📝 Documentation" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "♻ Refactoring" },
  { message = "^style", group = "🎨 Style" },
  { message = "^test", group = "🧪 Tests" },
  { message = "^ci", group = "🔧 Automation" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore", group = "🛠 Maintenance" },
  { message = "^ignore", skip = true },
]
