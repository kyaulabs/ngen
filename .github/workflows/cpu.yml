name: CPU foundation
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan, tsan]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install CPU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install conan==2.34.0 cmake==4.4.5 ninja==1.13.2
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Secret and commit policy checks
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.24.3 git --redact --no-banner
          npm install --no-save --package-lock=false --prefix "$RUNNER_TEMP/commit-policy" @commitlint/cli@19.8.1 @commitlint/config-conventional@19.8.1
          NODE_PATH="$RUNNER_TEMP/commit-policy/node_modules" "$RUNNER_TEMP/commit-policy/node_modules/.bin/commitlint" --from HEAD~1 --to HEAD
      - name: Prepare locked compatibility graph
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          profile=linux-clang
          type=Debug
          case "$PRESET" in
            release) type=Release ;;
            asan) profile=linux-asan ;;
            tsan) profile=linux-tsan ;;
          esac
          conan install . -pr:h "profiles/$profile" -pr:h profiles/ci-linux-clang -pr:b profiles/ci-linux-clang -s:h build_type="$type" --lockfile conan.lock --build=missing -of "build/$PRESET"
      - name: Configure, build, enumerate and test
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          cmake --preset "$PRESET"
          cmake --build --preset "$PRESET"
          ctest --preset "$PRESET" --show-only
          ctest --preset "$PRESET"
      - name: Check whitespace and offline runtime
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          git diff --check
          # The unprivileged child has no network interfaces beyond loopback.
          unshare -Urn -- env -u DISPLAY -u WAYLAND_DISPLAY "build/$PRESET/sim_harness"
# Configuration only until this workflow actually runs. Primary Clang 23,
# GCC 16, formatting/tidy 23 and Windows evidence remain separate gates.
