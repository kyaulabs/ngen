name: CPU foundation
on:
  pull_request:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'ci/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan, tsan]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install CPU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-format-18 clang-tidy-18
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install conan==2.34.0 cmake==4.4.4 ninja==1.13.2
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Test optional creator MCP over stdio
        if: matrix.preset == 'release'
        run: |
          python3 -m venv "$RUNNER_TEMP/creator-mcp"
          "$RUNNER_TEMP/creator-mcp/bin/pip" install -r tools/creator-mcp-requirements.txt
          PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/creator-mcp/bin/python" -m unittest tests.creator_mcp -v
      - name: Test Windows script boundaries (no Windows build)
        shell: pwsh
        run: ./tests/windows_build.ps1
      - name: Test flight handoff boundaries (no Windows build)
        shell: pwsh
        run: ./tests/windows_flight.ps1
      - name: Test runnable Windows flight commands (no Windows build)
        shell: pwsh
        run: ./tests/windows_commands.ps1
      - name: Test GPU provider diagnostic boundaries (no Windows provider)
        shell: pwsh
        run: ./tests/windows_gpu_memory.ps1
      - name: Test native GPU reader transport (no Windows counters)
        shell: pwsh
        run: ./tests/windows_gpu_reader.ps1
      - name: Test Jolt CRT generator contract (no Windows compilation)
        run: python tests/jolt_recipe.py
      - name: Test source-release automation boundaries
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.release_automation -v
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate release promotion branch
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        env:
          INTERNAL_RELEASE: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          test "$INTERNAL_RELEASE" = true
          python3 tools/release.py validate "$RELEASE_BRANCH"
      - name: Select reviewed revision range
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PROMOTION: ${{ (github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/')) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          diff_base="$(python3 tools/release.py review-base --base "$EVENT_BASE" --head "$EVENT_HEAD")"
          base="$diff_base"
          if [ "$PROMOTION" = true ]; then
            # Owner-approved promotion scope: develop history was reviewed already.
            # Only new release commits are re-linted; secret/diff scans stay full.
            base="$(python3 tools/release.py review-base --base "$EVENT_BASE" --head "$EVENT_HEAD" --promotion)"
          fi
          git rev-parse --verify "$base^{commit}"
          git rev-parse --verify "$diff_base^{commit}"
          git rev-parse --verify "$EVENT_HEAD^{commit}"
          {
            echo "REVIEW_BASE=$base"
            echo "DIFF_BASE=$diff_base"
            echo "REVIEW_HEAD=$EVENT_HEAD"
          } >> "$GITHUB_ENV"
      - name: Secret and commit policy checks
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.24.3 git --redact --no-banner
          npm install --no-save --package-lock=false --prefix "$RUNNER_TEMP/commit-policy" @commitlint/cli@19.8.1 @commitlint/config-conventional@19.8.1
          NODE_PATH="$RUNNER_TEMP/commit-policy/node_modules" "$RUNNER_TEMP/commit-policy/node_modules/.bin/commitlint" --from "$REVIEW_BASE" --to "$REVIEW_HEAD"
          git diff --check "$DIFF_BASE" "$REVIEW_HEAD"
      - name: Prepare locked compatibility graph
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          profile=linux-clang
          type=Debug
          case "$PRESET" in
            release) type=Release ;;
            asan) profile=linux-asan ;;
            tsan) profile=linux-tsan ;;
          esac
          conan install . -pr:h "profiles/$profile" -pr:h profiles/ci-linux-clang -pr:b profiles/ci-linux-clang -s:h build_type="$type" --lockfile conan.lock --build=missing -of "build/$PRESET"
      - name: Configure, build, enumerate and test
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          cmake --preset "$PRESET" -DNGEN_INSTALL_SDK=ON
          cmake --build --preset "$PRESET"
          ctest --preset "$PRESET" --show-only
          ctest --preset "$PRESET"
          python3 tests/sdk_consumer.py "build/$PRESET" "$PRESET"
      - name: Prepare pinned Lua for opt-in quest tests
        if: matrix.preset == 'release' || matrix.preset == 'asan'
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          lua="$RUNNER_TEMP/ngen-lua"
          install -d "$lua/prefix/lib/pkgconfig"
          curl --fail --silent --show-error --location --max-time 45 https://www.lua.org/ftp/lua-5.5.1.tar.gz -o "$lua/lua.tar.gz"
          printf '%s  %s\n' '1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce' "$lua/lua.tar.gz" | sha256sum --check
          tar -xzf "$lua/lua.tar.gz" -C "$lua"
          lua_flags=()
          if [ "$PRESET" = asan ]; then
            lua_flags=('MYCFLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer'
                       'MYLDFLAGS=-fsanitize=address,undefined -no-pie')
          fi
          make -C "$lua/lua-5.5.1" -j2 generic CC=clang-18 "${lua_flags[@]}"
          make -C "$lua/lua-5.5.1" install INSTALL_TOP="$lua/prefix"
          printf 'Name: Lua\nDescription: pinned Lua C library\nVersion: 5.5.1\nLibs: -L%s/lib -llua -lm\nCflags: -I%s/include\n' "$lua/prefix" "$lua/prefix" > "$lua/prefix/lib/pkgconfig/lua5.5.pc"
      - name: Verify standalone bounded quest
        if: matrix.preset == 'release'
        run: |
          PKG_CONFIG_PATH="$RUNNER_TEMP/ngen-lua/prefix/lib/pkgconfig" cmake --preset release -B build/quest-release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/release/conan_toolchain.cmake" -DNGEN_BUILD_QUEST_SCRIPT=ON
          cmake --build build/quest-release --target quest_script_tests survey_quest_tests survey_save_tests quest_survey -j2
          ctest --test-dir build/quest-release -R '^(quest_script|survey_quest|survey_save|survey_cli)$' --output-on-failure --no-tests=error
          clang-tidy-18 '-header-filter=.*/(engine/script|game/quests)/.*' -p build/quest-release engine/script/lua_rule.cpp game/quests/survey.cpp game/quests/save.cpp apps/quest_survey/main.cpp tests/quest_script.cpp tests/survey_quest.cpp tests/survey_save.cpp
      - name: Build and test headless local flight physics
        if: matrix.preset != 'tsan'
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          profile=linux-clang
          type=Debug
          cmake_args=()
          conan_args=()
          if [ "$PRESET" = release ]; then type=Release; fi
          if [ "$PRESET" = asan ]; then
            profile=linux-asan
            conan_args=(-c:h 'tools.build:exelinkflags=["-fsanitize=address,undefined", "-no-pie"]')
            cmake_args=(-DCMAKE_EXE_LINKER_FLAGS=-no-pie)
          fi
          if [ "$PRESET" != debug ]; then
            export PKG_CONFIG_PATH="$RUNNER_TEMP/ngen-lua/prefix/lib/pkgconfig"
            cmake_args+=(-DNGEN_BUILD_QUEST_SCRIPT=ON)
          fi
          conan export recipes/joltphysics --version=5.6.0 --user=ngen --channel=headless-double
          conan install . -pr:h "profiles/$profile" -pr:h profiles/ci-linux-clang -pr:b profiles/ci-linux-clang -s:h build_type="$type" -s:b build_type=Release -o '&:physics=True' --lockfile conan-physics.lock --build=missing -c tools.build:jobs=2 -of "build/flight-$PRESET" "${conan_args[@]}"
          cmake --preset "flight-$PRESET" "${cmake_args[@]}"
          cmake --build --preset "flight-$PRESET"
          ctest --preset "flight-$PRESET" --show-only
          sudo unshare --net -- runuser -u "$(id -un)" -- env -u DISPLAY -u WAYLAND_DISPLAY "$(command -v ctest)" --preset "flight-$PRESET"
          clang-tidy-18 -p "build/flight-$PRESET" engine/physics/world.cpp tests/physics.cpp game/flight/flight.cpp tests/flight.cpp game/flight/camera.cpp tests/flight_camera.cpp game/flight/input.cpp tests/flight_input.cpp game/travel/trajectory.cpp game/travel/journey.cpp tests/travel.cpp
          binaries=(physics_tests flight_tests flight_camera_tests flight_input_tests travel_tests)
          if [ "$PRESET" = release ]; then
            clang-tidy-18 '-header-filter=.*/game/quests/.*' -p build/flight-release game/quests/voyage.cpp tests/survey_voyage.cpp apps/quest_survey/main.cpp
          fi
          if [ "$PRESET" != debug ]; then
            binaries+=(quest_voyage survey_voyage_tests)
          fi
          for binary in "${binaries[@]}"; do
            dynamic="build/flight-$PRESET/$binary-dynamic.txt"
            readelf -d "build/flight-$PRESET/$binary" > "$dynamic"
            if grep -Ei 'NEEDED.*(SDL|vulkan|libX11|wayland|libGL\.|libEGL|dxgi|d3d)' "$dynamic"; then
              echo 'Unexpected presentation dependency in headless flight' >&2
              exit 1
            fi
          done
      - name: Build renderer and playable flight contracts with offline shaders
        if: matrix.preset == 'debug' || matrix.preset == 'asan'
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          # This peer uses socketpair, not a desktop, display server or GPU.
          sudo apt-get install -y libegl-dev libvulkan-dev libdecor-0-dev
          profile=linux-clang
          conan_args=()
          cmake_args=()
          if [ "$PRESET" = asan ]; then
            profile=linux-asan
            conan_args=(-c:h 'tools.build:exelinkflags=["-fsanitize=address,undefined", "-no-pie"]')
            export PKG_CONFIG_PATH="$RUNNER_TEMP/ngen-lua/prefix/lib/pkgconfig"
            cmake_args=(-DCMAKE_EXE_LINKER_FLAGS=-no-pie -DNGEN_BUILD_QUEST_SCRIPT=ON)
          fi
          conan export recipes/pulseaudio --version=17.0 --user=ngen --channel=callback-safe
          conan export recipes/sdl --version=3.4.16 --user=ngen --channel=wayland
          conan export recipes/slangc --version=2026.21 --user=ngen --channel=tools
          conan install . -pr:h "profiles/$profile" -pr:h profiles/ci-linux-clang -pr:b profiles/ci-linux-clang -s:b build_type=Release -o '&:renderer=True' -o '&:shaders=True' -o '&:assets=True' -o '&:inspector=True' -o '&:physics=True' -o '&:audio=True' --lockfile conan-demo.lock --build=missing -c tools.build:jobs=2 -c:h 'libsndfile/*:tools.cmake:configure_args=["-DENABLE_MPEG=OFF"]' -c:h 'pulseaudio/*:tools.meson.mesontoolchain:extra_variables={"project_options":{"systemd":"disabled","asyncns":"disabled"}}' -of "build/renderer-$PRESET" "${conan_args[@]}"
          cmake --preset "renderer-$PRESET" -DNGEN_BUILD_INSPECTOR=ON -DNGEN_BUILD_PHYSICS=ON -DNGEN_BUILD_FLIGHT_DEMO=ON -DNGEN_INSTALL_SDK=ON "${cmake_args[@]}"
          cmake --build --preset "renderer-$PRESET"
          ctest --preset "renderer-$PRESET" --show-only
          ctest --preset "renderer-$PRESET"
          python3 tests/sdk_consumer.py "build/renderer-$PRESET" "$PRESET" --renderer
          clang-tidy-18 -p "build/renderer-$PRESET" engine/render/context.cpp engine/render/surface.cpp engine/render/presentation.cpp engine/render/resources.cpp engine/render/post.cpp engine/render/mesh.cpp engine/render/overlay.cpp engine/render/environment.cpp tests/render_environment.cpp engine/render/vma.cpp apps/probe/presentation.cpp apps/render_probe/main.cpp apps/resource_probe/main.cpp tests/render_startup.cpp tests/render_surface.cpp tests/wayland_tablets.cpp tests/shader_layout.cpp tests/shader_gpu.cpp engine/render/scene.cpp engine/render/scene_draw.cpp apps/scene_probe/main.cpp apps/scene_probe/draw.cpp apps/asset_probe/main.cpp tests/assets.cpp engine/tools/inspector.cpp engine/tools/reload.cpp engine/tools/gui.cpp engine/tools/ui.cpp tests/inspector.cpp tests/reload.cpp apps/inspector_probe/main.cpp apps/scene_workload/fixture.cpp apps/scene_workload/main.cpp apps/scene_workload/allocations.cpp tests/workload.cpp apps/probe/capture.cpp
          clang-tidy-18 '--header-filter=.*/(engine|game|apps|tests)/.*' -p "build/renderer-$PRESET" apps/flight_demo/preset.cpp apps/flight_demo/view.cpp apps/flight_demo/main.cpp apps/flight_demo/app.cpp apps/flight_demo/hud_layout.cpp tests/flight_hud.cpp tests/flight_scene.cpp engine/audio/mixer.cpp engine/audio/output.cpp tests/audio_mixer.cpp tests/audio_output.cpp
          if [ "$PRESET" = asan ]; then
            clang-tidy-18 '--header-filter=.*/(engine|game|apps)/.*' -p "build/renderer-$PRESET" apps/flight_demo/survey.cpp
          fi
          clang-tidy-18 '--header-filter=.*/(tools/gpu_memory|tests)/.*' -p "build/renderer-$PRESET" tools/gpu_memory/counters.cpp tests/gpu_memory.cpp
      - name: Build and test bounded offline asset tools
        if: matrix.preset == 'debug' || matrix.preset == 'asan'
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          profile=linux-clang
          conan_args=()
          cmake_args=()
          if [ "$PRESET" = asan ]; then
            profile=linux-asan
            conan_args=(-c:h 'tools.build:exelinkflags=["-fsanitize=address,undefined", "-no-pie"]')
            cmake_args=(-DCMAKE_EXE_LINKER_FLAGS=-no-pie)
          fi
          conan export recipes/mikktspace --version=cci.20200325 --user=ngen --channel=defined-rotate
          conan install . -pr:h "profiles/$profile" -pr:h profiles/ci-linux-clang -pr:b profiles/ci-linux-clang -s:b build_type=Release -s:b compiler.cppstd=17 -o '&:asset_tools=True' --lockfile conan-assets.lock --build=missing -c tools.build:jobs=2 -of "build/asset-$PRESET" "${conan_args[@]}"
          cmake --preset "asset-$PRESET" -DNGEN_INSTALL_SDK=ON "${cmake_args[@]}"
          cmake --build --preset "asset-$PRESET"
          ctest --preset "asset-$PRESET" --show-only
          sudo unshare --net -- runuser -u "$(id -un)" -- env -u DISPLAY -u WAYLAND_DISPLAY "$(command -v ctest)" --preset "asset-$PRESET"
          python3 tests/asset_tidy.py
          python3 tools/assetc/check_tidy.py --build "build/asset-$PRESET" --tidy clang-tidy-18
          clang-tidy-18 -p "build/asset-$PRESET" apps/creator_player/main.cpp
      - name: Check whitespace and offline runtime
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          clang-format-18 --dry-run --Werror engine/world/coordinates/*pp tools/project_template/*.cpp engine/core/*pp engine/jobs/*pp engine/simulation/*pp engine/script/*pp engine/physics/*pp engine/audio/*pp engine/render/*pp engine/assets/*pp engine/tools/*pp tests/*.cpp tests/*.hpp apps/sim_harness/*.cpp apps/quest_survey/*.cpp apps/render_probe/*.cpp apps/resource_probe/*.cpp apps/probe/*pp apps/asset_probe/*.cpp apps/scene_probe/*.cpp apps/scene_workload/*pp apps/inspector_probe/*.cpp apps/flight_demo/*pp game/flight/*pp game/economy/*pp game/mining/*pp game/combat/*pp game/lifecycle/*pp game/docking/*pp game/quests/*pp recipes/joltphysics/test_package/*.cpp tools/assetc/*pp tools/gpu_memory/*pp
          clang-tidy-18 -p "build/$PRESET" engine/core/values.cpp engine/core/entities.cpp engine/jobs/jobs.cpp engine/simulation/simulation.cpp engine/world/coordinates/position.cpp engine/effects/particles.cpp game/economy/local_market.cpp game/mining/site.cpp game/combat/arena.cpp game/lifecycle/session.cpp game/docking/berth.cpp tests/core.cpp tests/jobs.cpp tests/simulation.cpp tests/coordinates.cpp tests/particles.cpp tests/economy.cpp tests/mining.cpp tests/combat.cpp tests/lifecycle.cpp tests/docking.cpp apps/sim_harness/main.cpp
          # Ubuntu restricts unprivileged user namespaces. Create only the
          # network namespace with sudo, then drop back to the runner identity.
          sudo unshare --net -- runuser -u "$(id -un)" -- env -u DISPLAY -u WAYLAND_DISPLAY "$PWD/build/$PRESET/sim_harness"
# Configuration only until this workflow actually runs. Primary Clang 23,
# GCC 16, local formatting/tidy 23 and Windows evidence remain separate gates.
