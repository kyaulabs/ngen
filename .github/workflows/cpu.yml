name: CPU foundation
on:
  pull_request:
  push:
    branches: [develop, 'feat/**', 'fix/**', 'ci/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan, tsan]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install CPU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-format-18 clang-tidy-18
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install conan==2.34.0 cmake==4.4.4 ninja==1.13.2
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Test Windows script boundaries (no Windows build)
        shell: pwsh
        run: ./tests/windows_build.ps1
      - name: Select reviewed revision range
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$EVENT_BASE"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            # Dispatch/new branch: compare against the integration merge base.
            base=$(git merge-base origin/develop "$EVENT_HEAD")
          fi
          git rev-parse --verify "$base^{commit}"
          git rev-parse --verify "$EVENT_HEAD^{commit}"
          echo "REVIEW_BASE=$base" >> "$GITHUB_ENV"
          echo "REVIEW_HEAD=$EVENT_HEAD" >> "$GITHUB_ENV"
      - name: Secret and commit policy checks
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.24.3 git --redact --no-banner
          npm install --no-save --package-lock=false --prefix "$RUNNER_TEMP/commit-policy" @commitlint/cli@19.8.1 @commitlint/config-conventional@19.8.1
          NODE_PATH="$RUNNER_TEMP/commit-policy/node_modules" "$RUNNER_TEMP/commit-policy/node_modules/.bin/commitlint" --from "$REVIEW_BASE" --to "$REVIEW_HEAD"
          git diff --check "$REVIEW_BASE" "$REVIEW_HEAD"
      - name: Prepare locked compatibility graph
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          profile=linux-clang
          type=Debug
          case "$PRESET" in
            release) type=Release ;;
            asan) profile=linux-asan ;;
            tsan) profile=linux-tsan ;;
          esac
          conan install . -pr:h "profiles/$profile" -pr:h profiles/ci-linux-clang -pr:b profiles/ci-linux-clang -s:h build_type="$type" --lockfile conan.lock --build=missing -of "build/$PRESET"
      - name: Configure, build, enumerate and test
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          cmake --preset "$PRESET"
          cmake --build --preset "$PRESET"
          ctest --preset "$PRESET" --show-only
          ctest --preset "$PRESET"
      - name: Build and test headless local flight physics
        if: matrix.preset != 'tsan'
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          profile=linux-clang
          type=Debug
          cmake_args=()
          conan_args=()
          if [ "$PRESET" = release ]; then type=Release; fi
          if [ "$PRESET" = asan ]; then
            profile=linux-asan
            conan_args=(-c:h 'tools.build:exelinkflags=["-fsanitize=address,undefined", "-no-pie"]')
            cmake_args=(-DCMAKE_EXE_LINKER_FLAGS=-no-pie)
          fi
          conan export recipes/joltphysics --version=5.6.0 --user=ngen --channel=headless-double
          conan install . -pr:h "profiles/$profile" -pr:h profiles/ci-linux-clang -pr:b profiles/ci-linux-clang -s:h build_type="$type" -s:b build_type=Release -o '&:physics=True' --lockfile conan-physics.lock --build=missing -c tools.build:jobs=2 -of "build/flight-$PRESET" "${conan_args[@]}"
          cmake --preset "flight-$PRESET" "${cmake_args[@]}"
          cmake --build --preset "flight-$PRESET"
          ctest --preset "flight-$PRESET" --show-only
          sudo unshare --net -- runuser -u "$(id -un)" -- env -u DISPLAY -u WAYLAND_DISPLAY "$(command -v ctest)" --preset "flight-$PRESET"
          clang-tidy-18 -p "build/flight-$PRESET" engine/physics/world.cpp tests/physics.cpp game/flight/flight.cpp tests/flight.cpp game/flight/camera.cpp tests/flight_camera.cpp game/flight/input.cpp tests/flight_input.cpp
          for binary in physics_tests flight_tests flight_camera_tests flight_input_tests; do
            dynamic="build/flight-$PRESET/$binary-dynamic.txt"
            readelf -d "build/flight-$PRESET/$binary" > "$dynamic"
            if grep -Ei 'NEEDED.*(SDL|vulkan|libX11|wayland|libGL\.|libEGL|dxgi|d3d)' "$dynamic"; then
              echo 'Unexpected presentation dependency in headless flight' >&2
              exit 1
            fi
          done
      - name: Build renderer and playable flight contracts with offline shaders
        if: matrix.preset == 'debug' || matrix.preset == 'asan'
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          # This peer uses socketpair, not a desktop, display server or GPU.
          sudo apt-get install -y libegl-dev libvulkan-dev libdecor-0-dev
          profile=linux-clang
          conan_args=()
          cmake_args=()
          if [ "$PRESET" = asan ]; then
            profile=linux-asan
            conan_args=(-c:h 'tools.build:exelinkflags=["-fsanitize=address,undefined", "-no-pie"]')
            cmake_args=(-DCMAKE_EXE_LINKER_FLAGS=-no-pie)
          fi
          conan export recipes/sdl --version=3.4.16 --user=ngen --channel=wayland
          conan export recipes/slangc --version=2026.21 --user=ngen --channel=tools
          conan install . -pr:h "profiles/$profile" -pr:h profiles/ci-linux-clang -pr:b profiles/ci-linux-clang -s:b build_type=Release -o '&:renderer=True' -o '&:shaders=True' -o '&:assets=True' -o '&:inspector=True' -o '&:physics=True' -o '&:audio=True' --lockfile conan-demo.lock --build=missing -c tools.build:jobs=2 -of "build/renderer-$PRESET" "${conan_args[@]}"
          cmake --preset "renderer-$PRESET" -DNGEN_BUILD_INSPECTOR=ON -DNGEN_BUILD_PHYSICS=ON -DNGEN_BUILD_FLIGHT_DEMO=ON "${cmake_args[@]}"
          cmake --build --preset "renderer-$PRESET"
          ctest --preset "renderer-$PRESET" --show-only
          ctest --preset "renderer-$PRESET"
          clang-tidy-18 -p "build/renderer-$PRESET" engine/render/context.cpp engine/render/surface.cpp engine/render/presentation.cpp engine/render/resources.cpp engine/render/post.cpp engine/render/mesh.cpp engine/render/overlay.cpp engine/render/environment.cpp tests/render_environment.cpp engine/render/vma.cpp apps/probe/presentation.cpp apps/render_probe/main.cpp apps/resource_probe/main.cpp tests/render_startup.cpp tests/render_surface.cpp tests/wayland_tablets.cpp tests/shader_layout.cpp tests/shader_gpu.cpp engine/render/scene.cpp engine/render/scene_draw.cpp apps/scene_probe/main.cpp apps/scene_probe/draw.cpp apps/asset_probe/main.cpp tests/assets.cpp engine/tools/inspector.cpp engine/tools/reload.cpp engine/tools/gui.cpp engine/tools/ui.cpp tests/inspector.cpp tests/reload.cpp apps/inspector_probe/main.cpp apps/scene_workload/fixture.cpp apps/scene_workload/main.cpp apps/scene_workload/allocations.cpp tests/workload.cpp apps/probe/capture.cpp
          clang-tidy-18 '--header-filter=.*/(engine|game|apps|tests)/.*' -p "build/renderer-$PRESET" apps/flight_demo/preset.cpp apps/flight_demo/view.cpp apps/flight_demo/main.cpp apps/flight_demo/app.cpp tests/flight_scene.cpp engine/audio/mixer.cpp engine/audio/output.cpp tests/audio_mixer.cpp tests/audio_output.cpp
      - name: Build and test bounded offline asset tools
        if: matrix.preset == 'debug' || matrix.preset == 'asan'
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          profile=linux-clang
          conan_args=()
          cmake_args=()
          if [ "$PRESET" = asan ]; then
            profile=linux-asan
            conan_args=(-c:h 'tools.build:exelinkflags=["-fsanitize=address,undefined", "-no-pie"]')
            cmake_args=(-DCMAKE_EXE_LINKER_FLAGS=-no-pie)
          fi
          conan export recipes/mikktspace --version=cci.20200325 --user=ngen --channel=defined-rotate
          conan install . -pr:h "profiles/$profile" -pr:h profiles/ci-linux-clang -pr:b profiles/ci-linux-clang -s:b build_type=Release -s:b compiler.cppstd=17 -o '&:asset_tools=True' --lockfile conan-assets.lock --build=missing -c tools.build:jobs=2 -of "build/asset-$PRESET" "${conan_args[@]}"
          cmake --preset "asset-$PRESET" "${cmake_args[@]}"
          cmake --build --preset "asset-$PRESET"
          ctest --preset "asset-$PRESET" --show-only
          sudo unshare --net -- runuser -u "$(id -un)" -- env -u DISPLAY -u WAYLAND_DISPLAY "$(command -v ctest)" --preset "asset-$PRESET"
          python3 tests/asset_tidy.py
          python3 tools/assetc/check_tidy.py --build "build/asset-$PRESET" --tidy clang-tidy-18
      - name: Check whitespace and offline runtime
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          clang-format-18 --dry-run --Werror engine/core/*pp engine/jobs/*pp engine/simulation/*pp engine/physics/*pp engine/audio/*pp engine/render/*pp engine/assets/*pp engine/tools/*pp tests/*.cpp tests/*.hpp apps/sim_harness/*.cpp apps/render_probe/*.cpp apps/resource_probe/*.cpp apps/probe/*pp apps/asset_probe/*.cpp apps/scene_probe/*.cpp apps/scene_workload/*pp apps/inspector_probe/*.cpp apps/flight_demo/*pp game/flight/*pp recipes/joltphysics/test_package/*.cpp tools/assetc/*pp
          clang-tidy-18 -p "build/$PRESET" engine/core/values.cpp engine/core/entities.cpp engine/jobs/jobs.cpp engine/simulation/simulation.cpp tests/core.cpp tests/jobs.cpp tests/simulation.cpp apps/sim_harness/main.cpp
          # Ubuntu restricts unprivileged user namespaces. Create only the
          # network namespace with sudo, then drop back to the runner identity.
          sudo unshare --net -- runuser -u "$(id -un)" -- env -u DISPLAY -u WAYLAND_DISPLAY "$PWD/build/$PRESET/sim_harness"
# Configuration only until this workflow actually runs. Primary Clang 23,
# GCC 16, local formatting/tidy 23 and Windows evidence remain separate gates.
